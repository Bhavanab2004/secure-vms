<!doctype html><meta charset=utf-8><title>Login</title>
<style>body{font:15px system-ui;background:#0f172a;color:#e2e8f0;display:grid;place-items:center;height:100vh;margin:0}
form{background:#1e293b;padding:28px;border-radius:12px;display:grid;gap:10px;width:260px}input,button{padding:9px;border-radius:6px;border:0}button{background:#3b82f6;color:#fff}</style>
<form method=post><h3>Secure VMS</h3><input name=username placeholder=Username autofocus><input name=password type=password placeholder=Password>
<button>Sign in</button><small style="color:#f87171">{{err}}</small></form>
